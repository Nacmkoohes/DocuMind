
services:
  web:
    build: .
    container_name: documind
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 180
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    restart: unless-stopped

volumes:
  sqlite_data:
  media_data:
